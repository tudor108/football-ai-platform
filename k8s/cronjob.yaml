apiVersion: batch/v1
kind: CronJob
metadata:
  name: football-daily-pipeline
  namespace: football-analytics
spec:
  schedule: "32 2 * * *"
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: football-daily-pipeline
        spec:
          serviceAccountName: football-pipeline
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pipeline
              image: europe-central2-docker.pkg.dev/project-73d1e32a-8e68-4750-93c/football-analytics/pipeline:latest
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: football-config
                - secretRef:
                    name: football-api-secrets
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
