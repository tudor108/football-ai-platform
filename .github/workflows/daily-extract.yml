name: Daily API-Football extraction

on:
  schedule:
    # Runs at 06:00 UTC every day (≈ 09:00 EEST in summer).
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write  # Required for Workload Identity Federation

jobs:
  extract-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/205718552008/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-uploader@project-73d1e32a-8e68-4750-93c.iam.gserviceaccount.com

      - name: Run extraction + upload pipeline
        run: python -m extractdatafromapi.main
