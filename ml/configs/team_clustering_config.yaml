# Team clustering config (local-first, production-ready)
features:
  - avg_goals_scored
  - avg_goals_conceded
  - avg_goal_diff
  - std_goal_diff
  - win_rate
  - draw_rate
  - loss_rate
  - avg_points
  - form_pts_avg
  - form_gf_avg
  - form_ga_avg
  - form_gd_avg
  - form_wins_avg
  - form_draws_avg
  - form_losses_avg
  - home_ratio
  - attack_strength
  - defense_strength
  - form_score

preprocessing:
  fillna: median
  scaler: robust
  pca: true
  pca_components: 6

algorithms:
  KMeans:
    enabled: true
    param_grid:
      - n_clusters: 3
        random_state: 42
        n_init: 20
      - n_clusters: 4
        random_state: 42
        n_init: 20
      - n_clusters: 5
        random_state: 42
        n_init: 20
  MiniBatchKMeans:
    enabled: true
    param_grid:
      - n_clusters: 3
        random_state: 42
        batch_size: 32
      - n_clusters: 4
        random_state: 42
        batch_size: 32
      - n_clusters: 5
        random_state: 42
        batch_size: 32
  GaussianMixture:
    enabled: true
    param_grid:
      - n_components: 3
        random_state: 42
        covariance_type: full
      - n_components: 4
        random_state: 42
        covariance_type: full
      - n_components: 5
        random_state: 42
        covariance_type: full
  AgglomerativeClustering:
    enabled: true
    param_grid:
      - n_clusters: 3
        linkage: ward
      - n_clusters: 4
        linkage: ward
      - n_clusters: 5
        linkage: ward
  SpectralClustering:
    enabled: true
    param_grid:
      - n_clusters: 3
        random_state: 42
        affinity: nearest_neighbors
        n_neighbors: 5
      - n_clusters: 4
        random_state: 42
        affinity: nearest_neighbors
        n_neighbors: 5
  Birch:
    enabled: true
    param_grid:
      - n_clusters: 3
      - n_clusters: 4
      - n_clusters: 5
  DBSCAN:
    enabled: true
    param_grid:
      - eps: 0.7
        min_samples: 3
      - eps: 0.9
        min_samples: 3
  MeanShift:
    enabled: true
    bandwidth: null

comparison:
  select_by: composite
  min_clusters: 2
  max_clusters: 8

input:
  source: local_derived
  path: output/derived/fact_match_features.csv
  table: fact_match_features

output:
  clusters_dir: output/ml/clusters
  metrics_dir: output/ml/metrics
  plots_dir: output/ml/plots
  load_to_bigquery: false
  bq_table: ml_team_clusters

mlflow:
  enabled: false
  experiment: team_clustering
